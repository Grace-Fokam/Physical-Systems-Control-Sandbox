[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "control-sandbox"
version = "0.1.0"
description = "A benchmark for controlling physical systems under changing conditions: LQR, MPC, adaptive MPC, model-free RL and learned-model MPC."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Grace Fokam" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]
keywords = ["control", "model predictive control", "reinforcement learning", "robustness", "physical AI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
ctrl-sweep = "ctrlsandbox.sweep:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
